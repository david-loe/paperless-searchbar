[project]
name = "paperless-searchbar"
version = "0.1.0"
description = "Read-only Paperless search with scoped guest and OIDC access"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.35",
    "httpx>=0.28",
    "pydantic-settings>=2.10",
    "sqlalchemy>=2.0",
    "alembic>=1.16",
    "authlib>=1.6",
    "itsdangerous>=2.2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "respx>=0.22", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/searchbar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
